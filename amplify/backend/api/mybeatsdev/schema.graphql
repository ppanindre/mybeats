# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY {
    globalAuthRule: AuthRule = { allow: public }
} # FOR TESTING ONLY!
type Doctor @model @auth(rules: [{ allow: public }]) {
    doctorID: ID! @primaryKey
    firstname: String!
    lastname: String!
    email: String
    phoneNumber: String
    licenseNumber: String
    upiId: String
    specialties: [Specialty] @manyToMany(relationName: "DoctorSpecialties")
    primarySpecializationId: ID @index(name: "byPrimarySpecialization")
    primarySpecialization: Specialty
        @hasOne(fields: ["primarySpecializationId"])
    address: String
    city: String
    state: String
    experience: String

    secondarySpecializationIds: [ID]
    secondarySpecializations: [Specialty] @manyToMany(relationName: "DoctorSecondarySpecialties")

    availableForVideoConsultation: Boolean!
    feeForVideoConsultation: String!
    educationExperience: String
    awardsRecognition: String
    website: String
    zipcode: String! @index(name: "byzipcode", queryField: "doctorByZipcode")
    appointments: [Appointment]
        @hasMany(indexName: "byDoctor", fields: ["doctorID"])
    availability: [Availability]
        @hasMany(indexName: "byDoctor", fields: ["doctorID"])
    prescriptions: [Prescription] 
        @hasMany(indexName: "byDoctor", fields: ["doctorID"])
    patientStories: [PatientStory] 
        @hasMany(indexName: "byDoctor", fields: ["doctorID"]) 
    chatMessages: [ChatMessage] 
        @hasMany(indexName: "byDoctor", fields: ["doctorID"])
}

type Specialty @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    name: String! @index(name: "byName", queryField: "specialtyByName")
    doctors: [Doctor] @manyToMany(relationName: "DoctorSpecialties")
    secondaryDoctors: [Doctor] @manyToMany(relationName: "DoctorSecondarySpecialties")

    primaryToSecondaryLinks: [PrimaryToSecondary] @hasMany(indexName: "byPrimarySpecialty", fields: ["id"])
    secondaryToPrimaryLinks: [PrimaryToSecondary] @hasMany(indexName: "bySecondarySpecialty", fields: ["id"])

    healthConditions: [HealthCondition] @manyToMany(relationName: "SpecialtyHealthConditions")
}

type HealthCondition @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    name: String! @index(name: "byName", queryField: "healthConditionByName")
    specialties: [Specialty] @manyToMany(relationName: "SpecialtyHealthConditions")
}

type PrimaryToSecondary @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    primarySpecialtyID: ID! @index(name: "byPrimarySpecialty")
    secondarySpecialtyID: ID! @index(name: "bySecondarySpecialty")
    primarySpecialty: Specialty @belongsTo(fields: ["primarySpecialtyID"])
    secondarySpecialty: Specialty @belongsTo(fields: ["secondarySpecialtyID"])
}

type Patient @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    profileImage: String
    firstname: String!
    lastname: String!
    email: String
    phoneNumber: String
    address: String
    zipcode: String
    appointments: [Appointment]
        @hasMany(indexName: "byPatient", fields: ["id"])
    age: String
    weight: String
    height: String
    professionList: [String]
    underlyingConditionsList: [String]
    otherCondition: String
     prescriptions: [Prescription] 
        @hasMany(indexName: "byPatient", fields: ["id"])
     labTestResults: [LabTestResult]
        @hasMany(indexName: "byPatient", fields: ["id"])
    chatMessages: [ChatMessage] 
        @hasMany(indexName: "byPatient", fields: ["id"])
}

type Availability @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    doctorID: ID!
        @index(
            name: "byDoctor"
            queryField: "availabilityByDoctor"
            sortKeyFields: ["startTime"]
        )
    startTime: AWSDateTime!
    endTime: AWSDateTime!
    doctor: Doctor @belongsTo(fields: ["doctorID"])
}

type Appointment @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    doctorID: ID!
        @index(
            name: "byDoctor"
            queryField: "slotsByDoctor"
            sortKeyFields: ["startTime"]
        )
    patientId: ID!
        @index(
            name: "byPatient"
            queryField: "slotsByPatient"
            sortKeyFields: ["startTime"]
        )
    startTime: AWSDateTime!
    endTime: AWSDateTime!
    type: String
    isBooked: Boolean!
    doctor: Doctor @belongsTo(fields: ["doctorID"])
    patient: Patient @belongsTo(fields: ["patientId"])
    patientStory: PatientStory @hasOne(fields: ["id"])
    doctorNotes: String
    imagePaths: [String]
    prescriptions: [Prescription] @hasMany(indexName: "byAppointment", fields: ["id"])
    prescriptionImagePaths: [String]
}

type Prescription @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    medicineName: String!
    type: String!
    dosage: String!
    days: String!
    dosageQuantity: String!
    startDate: String!
    endDate: String!
    doctorID: ID! @index(name: "byDoctor")
    doctor: Doctor @belongsTo(fields: ["doctorID"])
    patientID: ID! @index(name: "byPatient")
    patient: Patient @belongsTo(fields: ["patientID"])
    appointmentID: ID! @index(name: "byAppointment")
    appointment: Appointment @belongsTo(fields: ["appointmentID"])
}

type PatientStory @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    doctorID: ID! @index(name: "byDoctor", queryField: "storiesByDoctor")
    doctor: Doctor @belongsTo(fields: ["doctorID"])
    patientID: ID! @index(name: "byPatient", queryField: "storiesByPatient") 
    patientName: String!
    rating: String! 
    date: AWSDateTime! 
    story: String
    appointmentID: ID! @index(name: "byAppointment", queryField: "storiesByAppointment")
    appointment: Appointment @belongsTo(fields: ["appointmentID"])
}

type LabTestResult @model @auth(rules: [{ allow: public }]) {
    id: ID! @primaryKey
    title: String! 
    description: String 
    testDate: AWSDateTime
    labResultImages: [String] 
    patientID: ID! @index(name: "byPatient", queryField: "labTestsByPatient")
    patient: Patient @belongsTo(fields: ["patientID"])
}

type ChatMessage @model @auth(rules: [{ allow: public }]) {
  id: ID! @primaryKey
  chatSessionId: String! @index(name: "byChatSessionId", queryField: "messagesBySession")
  doctorID: ID! @index(name: "byDoctor")
  doctor: Doctor @belongsTo(fields: ["doctorID"])
  patientID: ID @index(name: "byPatient") 
  patient: Patient @belongsTo(fields: ["patientID"])
  
  messageID: String! 
  sender: String! 
  content: String!
  messageType: String # optional: "text", "image", "file", etc.
  status: String # optional: "sent", "delivered", "read"
  timestamp: AWSDateTime!
  ttl: Int 

  # 0ptional indexing for time based queries
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}
